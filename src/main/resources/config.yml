  break-denied-arena: "<red>This block is part of the arena (unbreakable)."
  death-chat: "<dark_red>☠ <red>{player} <gray>died"
  death-chat-killer: "<dark_red>☠ <red>{player} <gray>was slain by <white>{killer} <gray>(<red>{hp}❤<gray>)"

