  ranked-loss: "<gold>Ranked <dark_gray>» <red>-{delta} <gray>points <dark_gray>(<white>{points}<dark_gray>) {rank}"
  death-actionbar: "<red>{player} <dark_red>died"
  death-actionbar-killer: "<red>{player} <dark_red>died <gray>(killed by <gold>{killer}<gray>)"
  stats-line: "<gold>{player} <gray>| {rank} <gray>({points}) | <yellow>Wins {wins} <gray>| <yellow>Losses {losses} <gray>| <yellow>Kills {kills} <gray>| <yellow>Deaths {deaths} <gray>| K/D <white>{kd}"
