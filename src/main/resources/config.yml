tab:
  header:
    - "<gradient:#FFE066:#FFA500><bold>DUELS</bold></gradient>"
    - "<gray>Online: <gold>{online}"
  footer:
    - "<gray>Ping: <gold>{ping}ms"
    - "<gradient:#FFE066:#FFA500>play.example.net</gradient>"
  name-lobby: "<dark_gray>[{rank}<dark_gray>] <white>{player}"
  name-fighting: "<red>[Fighting] <white>{player}"
  name-spectating: "<gray>[Spec] <white>{player}"

ranked:                             # Elo ratings, one per gamemode. TUNED TO BE VERY HARD (edit freely)
  start-rating: 1000
  base-k: 20                        # points moved per match between equal players
  win-multiplier: 0.6               # gains x this  (lower = harder)   equal fight: +6
  loss-multiplier: 1.0              # losses x this (higher = harder)  equal fight: -10
  gain-decay-per-rank: 0.25         # each rank divides gains by (1 + rank * this)
  loss-growth-per-rank: 0.10        # each rank multiplies losses by (1 + rank * this)
  min-rating: 0
  search-window: 150                # max rating difference when you start searching
  window-growth: 25                 # + this every window-step-seconds while waiting
  window-step-seconds: 10
  max-window: 600
  bar-length: 20
  bar-filled: "█"
  bar-empty: "░"
  actionbar: "{rank} <dark_gray>[{bar}<dark_gray>] <white>{points}<gray>/<white>{next} {delta}"   # shown above the hotbar
  actionbar-max: "{rank} <dark_gray>[{bar}<dark_gray>] <white>{points} <gold>MAX {delta}"
  ranks:                            # min = rating needed. Keep them sorted from low to high.
    - {name: "<#CD7F32><bold>Bronze", min: 0}
    - {name: "<#C0C0C0><bold>Silver", min: 1100}
    - {name: "<#FFD700><bold>Gold", min: 1250}
    - {name: "<#7FFFD4><bold>Platinum", min: 1450}
    - {name: "<#55FFFF><bold>Diamond", min: 1700}
    - {name: "<#FF55FF><bold>Master", min: 2000}
    - {name: "<#FF5555><bold>Grandmaster", min: 2400}
    - {name: "<#FFAA00><bold>Legend", min: 3000}

uhc:                                # /kit setuhc [kit]  = no natural regen.  /kit goldenhead  = gives you the item
  golden-head:
    material: PLAYER_HEAD
    name: "<gold><bold>Golden Head"
    lore: ["<gray>Right-click to eat", "<gray>Regeneration + Absorption"]
    regen-seconds: 9
    regen-level: 2
    absorption-hearts: 2

leaderboards:                       # /sb spawn ~ ~ ~ wins | kills | deaths | lose | points [kit]
  update-seconds: 30
  size: 10
  titles:
    wins: "<gradient:#FFE066:#FFA500><bold>TOP WINS</bold></gradient>"
    kills: "<gradient:#FFE066:#FFA500><bold>TOP KILLS</bold></gradient>"
    deaths: "<gradient:#FFE066:#FFA500><bold>TOP DEATHS</bold></gradient>"
    losses: "<gradient:#FFE066:#FFA500><bold>TOP LOSSES</bold></gradient>"
    points: "<gradient:#FFE066:#FFA500><bold>TOP RANKED</bold></gradient>"
    points-kit: "<gradient:#FFE066:#FFA500><bold>TOP {kit}</bold></gradient>"
  line: "<gold>#{rank} <white>{player} <gray>- <yellow>{value}"
  empty: "<gray>No data yet"
  footer: "<gray>Updates every {seconds}s"

tiers:                              # shown next to the name (nametag, tab, chat): [SPEAR HT3] Name  - coloured by tier
  enabled: true
  chat: true                        # also put the tier in chat
  tag-format: "<dark_gray>[<white>{kit} {tier}<dark_gray>] "
  tab-lobby: "{tier}{namecolor}{player}"
  tab-fighting: "<red>[Fighting] {tier}{namecolor}{player}"
  tab-spectating: "<gray>[Spec] {tier}{namecolor}{player}"
  # Tier = your Elo in a gamemode (the best gamemode is shown). Admin override: /tier set [player] [kit] [tier]
  # min = rating needed. Sorted from lowest (LT5) to highest (HT1). color = nametag colour (named colour), name-color = tab/chat colour.
  list:
    - {name: "LT5", min: 0,    tag: "<#6E6E6E>LT5", color: "dark_gray",    name-color: "<#8A8A8A>"}
    - {name: "HT5", min: 1100, tag: "<#B0B0B0>HT5", color: "gray",         name-color: "<#C8C8C8>"}
    - {name: "LT4", min: 1250, tag: "<#55FF55>LT4", color: "green",        name-color: "<#55FF55>"}
    - {name: "HT4", min: 1450, tag: "<#00AA00>HT4", color: "dark_green",   name-color: "<#00CC44>"}
    - {name: "LT3", min: 1700, tag: "<#55FFFF>LT3", color: "aqua",         name-color: "<#55FFFF>"}
    - {name: "HT3", min: 2000, tag: "<#5555FF>HT3", color: "blue",         name-color: "<#6A6AFF>"}
    - {name: "LT2", min: 2400, tag: "<#FF55FF>LT2", color: "light_purple", name-color: "<#FF55FF>"}
    - {name: "HT2", min: 2800, tag: "<#FF5555>HT2", color: "red",          name-color: "<#FF5555>"}
    - {name: "LT1", min: 3200, tag: "<#FFFF55><bold>LT1</bold>", color: "yellow", name-color: "<#FFE866>"}
    - {name: "HT1", min: 3600, tag: "<#FFAA00><bold>HT1</bold>", color: "gold",   name-color: "<gradient:#FFE066:#FFA500><bold>"}

arena-door:                         # /arena door [arena] gives a wand: pick the wall between the spawns.
  enabled: true                     # the wall closes when a match starts and opens at FIGHT!
  material: IRON_BARS               # any block: GLASS, IRON_BARS, BARRIER, ...
